name: CablePrep Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        shell: bash
        run: |
          set -e
          for f in js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Person 1 simulation regression tests
        run: node tests/run-tests.js
